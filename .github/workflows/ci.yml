name: platio-ci

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Firmware unit tests
        run: pio test -e native
      - name: Compile ESP32 firmware
        run: pio run -e esp32dev

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Expo dependency check
        run: npx expo install --check
      - name: Validate native Android configuration
        run: npx expo prebuild --platform android --no-install
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist-ci
